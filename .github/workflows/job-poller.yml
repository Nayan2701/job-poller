name: Job Poller

on:
  schedule:
    # every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed to commit the updated seen_jobs.json snapshot

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run poller
        id: poller
        run: python3 poller.py > new_matches.jsonl

      - name: Send Telegram alerts for new matches
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -s new_matches.jsonl ]; then
            while IFS= read -r line; do
              company=$(echo "$line" | python3 -c "import json,sys; print(json.load(sys.stdin)['company'])")
              title=$(echo "$line" | python3 -c "import json,sys; print(json.load(sys.stdin)['title'])")
              url=$(echo "$line" | python3 -c "import json,sys; print(json.load(sys.stdin)['url'])")
              text="🔔 New posting: ${company} — ${title}"$'\n'"${url}"
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" \
                --data-urlencode text="$text"
            done < new_matches.jsonl
          else
            echo "No new matches this run."
          fi

      - name: Commit updated snapshot
        run: |
          git config user.name "job-poller-bot"
          git config user.email "actions@github.com"
          git add seen_jobs.json
          git diff --quiet --cached || git commit -m "Update job snapshot [skip ci]"
          git pull --rebase origin main
          git push
